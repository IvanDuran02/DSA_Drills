[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithm-drills"
version = "0.1.0"
description = "Algorithm implementation gym for Google SWE interview preparation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-timeout>=2.3.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
line-length = 100
