id: dp-knapsack-01
name: 0/1 Knapsack Problem
category: dynamic_programming
difficulty: Medium
level: 2
recommended_minutes: 12
target_complexity:
  time: O(N * W)
  space: O(W)
function_signature: "def knapsack_01(weights: list[int], values: list[int], capacity:\
  \ int) -> int:\n    \"\"\"\n    Find max value achievable with given capacity where\
  \ each item can be taken at most once.\n    Target Time: O(N * W)\n    Target Space:\
  \ O(W)\n    \"\"\"\n    raise NotImplementedError\n"
starter_path: drills/dynamic_programming/knapsack_01.py
