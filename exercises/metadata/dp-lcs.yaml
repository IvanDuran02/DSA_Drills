id: dp-lcs
name: Longest Common Subsequence
category: dynamic_programming
difficulty: Medium
level: 2
recommended_minutes: 12
target_complexity:
  time: O(M * N)
  space: O(M * N)
function_signature: "def longest_common_subsequence(text1: str, text2: str) -> int:\n\
  \    \"\"\"\n    Find length of longest common subsequence of text1 and text2.\n\
  \    Target Time: O(M * N)\n    Target Space: O(M * N)\n    \"\"\"\n    raise NotImplementedError\n"
starter_path: drills/dynamic_programming/lcs.py
test_path: tests/dynamic_programming/test_lcs.py
reference_path: reference/dynamic_programming/lcs.py
description: 'Implement Longest Common Subsequence in Python 3.14+.


  Target Time: O(M * N)

  Target Space: O(M * N)'
hints:
  1: 2D table of size (M+1) x (N+1).
  2: 'If text1[i-1] == text2[j-1]: dp[i][j] = dp[i-1][j-1] + 1.'
  3: Else dp[i][j] = max(dp[i-1][j], dp[i][j-1]).
  4: O(M * N) time.
  5: See reference in reference/dynamic_programming/lcs.py.
variants:
- default
