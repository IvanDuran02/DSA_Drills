id: linked-list-remove-nth
name: Remove Nth Node From End of List
category: linked_lists
difficulty: Medium
level: 2
recommended_minutes: 10
target_complexity:
  time: O(N)
  space: O(1)
function_signature: "from typing import Optional\nfrom drills.structures import ListNode\n\
  \ndef remove_nth_from_end(head: Optional[ListNode], n: int) -> Optional[ListNode]:\n\
  \    \"\"\"\n    Remove nth node from end of list and return its head in one pass.\n\
  \    Target Time: O(N)\n    Target Space: O(1)\n    \"\"\"\n    raise NotImplementedError\n"
starter_path: drills/linked_lists/remove_nth_node.py
test_path: tests/linked_lists/test_remove_nth_node.py
reference_path: reference/linked_lists/remove_nth_node.py
description: 'Implement Remove Nth Node From End of List in Python 3.14+.


  Target Time: O(N)

  Target Space: O(1)'
hints:
  1: Use dummy node before head to handle removing the head node.
  2: Advance fast pointer n + 1 steps ahead of slow.
  3: Move both until fast is None; slow is right before target.
  4: slow.next = slow.next.next.
  5: See reference in reference/linked_lists/remove_nth_node.py.
variants:
- default
