id: heap-top-k-frequent
name: Top K Frequent Elements
category: heaps
difficulty: Medium
level: 3
recommended_minutes: 12
target_complexity:
  time: O(N log K)
  space: O(N + K)
function_signature: "import heapq\nfrom collections import Counter\n\ndef top_k_frequent(nums:\
  \ list[int], k: int) -> list[int]:\n    \"\"\"\n    Return the k most frequent elements\
  \ in nums.\n    Target Time: O(N log K)\n    Target Space: O(N + K)\n    \"\"\"\n\
  \    raise NotImplementedError\n"
