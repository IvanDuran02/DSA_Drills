id: graph-multisource-bfs
name: Multi-Source BFS
category: graphs
difficulty: Medium
level: 3
recommended_minutes: 15
target_complexity:
  time: O(R * C)
  space: O(R * C)
function_signature: "def shortest_distance_from_sources(grid: list[list[int]]) ->\
