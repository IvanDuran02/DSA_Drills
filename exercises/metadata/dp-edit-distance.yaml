id: dp-edit-distance
name: Edit Distance (Levenshtein)
category: dynamic_programming
difficulty: Hard
level: 3
recommended_minutes: 15
target_complexity:
  time: O(M * N)
  space: O(M * N)
function_signature: "def min_distance(word1: str, word2: str) -> int:\n    \"\"\"\n\
  \    Find minimum number of operations (insert, delete, replace) to convert word1\
  \ to word2.\n    Target Time: O(M * N)\n    Target Space: O(M * N)\n    \"\"\"\n\
  \    raise NotImplementedError\n"
starter_path: drills/dynamic_programming/edit_distance.py
test_path: tests/dynamic_programming/test_edit_distance.py
reference_path: reference/dynamic_programming/edit_distance.py
description: 'Implement Edit Distance (Levenshtein) in Python 3.14+.


  Target Time: O(M * N)

  Target Space: O(M * N)'
hints:
  1: dp[i][j] = min distance between word1[:i] and word2[:j].
  2: 'If match: dp[i][j] = dp[i-1][j-1].'
  3: 'Else: 1 + min(insert, delete, replace).'
  4: O(M * N) time.
  5: See reference in reference/dynamic_programming/edit_distance.py.
variants:
- default
