id: graph-topo-dfs
name: Topological Sort using DFS
category: graphs
difficulty: Medium
level: 3
recommended_minutes: 15
target_complexity:
  time: O(V + E)
  space: O(V)
function_signature: "def topological_sort_dfs(n: int, edges: list[list[int]]) -> list[int]:\n\
  \    \"\"\"\n    Return a valid topological order of nodes 0 to n-1. Return empty\
  \ list if cycle exists.\n    Target Time: O(V + E)\n    Target Space: O(V)\n   \
  \ \"\"\"\n    raise NotImplementedError\n"
starter_path: drills/graphs/topo_dfs.py
test_path: tests/graphs/test_topo_dfs.py
reference_path: reference/graphs/topo_dfs.py
description: 'Implement Topological Sort using DFS in Python 3.14+.


  Target Time: O(V + E)

  Target Space: O(V)'
hints:
  1: Postorder completion DFS reversed gives topological sort.
  2: Use cycle detection with state 1 to catch cycles.
  3: Return [] if cycle is detected.
  4: Complexity is O(V + E).
  5: See reference in reference/graphs/topo_dfs.py.
